[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scholar-trace"
version = "0.1.0"
description = "Evidence-grounded paper evaluation agent research prototype"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "ylj-0132" },
]
dependencies = [
    "litellm>=1.40",
    "json-repair>=0.25",
    "pypdf>=4.0",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
scholar-trace = "deep_research.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
